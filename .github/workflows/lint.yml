name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff and ty
    runs-on: ubuntu-latest
    steps:
      # Pinned by SHA rather than tag so a moved tag cannot change what runs.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # The lint group pins ruff and ty. The container-only imports are declared
      # in pyproject.toml, so nothing else needs installing.
      - name: Ruff check
        run: uv run --group lint ruff check .

      - name: Ruff format
        run: uv run --group lint ruff format --check .

      - name: ty
        run: uv run --group lint ty check --no-progress .
