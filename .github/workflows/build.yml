name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Rebuild weekly on Sundays to pick up upstream frigate:stable updates
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      frigate_version:
        description: 'Upstream Frigate tag (e.g. stable, 0.15.0)'
        required: false
        default: 'stable'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set Frigate version
        id: frigate_ver
        run: |
          VER=${{ github.event.inputs.frigate_version || 'stable' }}
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRIGATE_VERSION=${{ steps.frigate_ver.outputs.version }}
